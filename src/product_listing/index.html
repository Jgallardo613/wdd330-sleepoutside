<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Products</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/product-listing.js" type="module"></script>
  </head>

  <body>
    <header id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h1>Top Products</h1>
        <ul class="product-list"></ul>
      </section>

      <button id="openNews">
        <p>Subscribe to our Newsletter!</p>
      </button>

      <dialog id="newsletter-dialouge">
        <form>
          <p>Get the latest news and updates from Sleep Outside.</p>
          <label for="name">Name: <input type="text" id="name" name="name" required /></label>
          <label for="email">Email: <input type="email" id="email" name="email" required /></label>
          <div>
            <button type="submit" id="subscribeNews">Subscribe</button>
            <button type="button" id="closeNews">Nevermind</button>
          </div>
        </form>
      </dialog>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
