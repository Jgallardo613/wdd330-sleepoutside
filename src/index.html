<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js" type="module"></script>
  </head>

  <body>
    <header id="main-header"></header>

    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="categories">
        <h2>Shop by Category</h2>
        <div class="category-list">
          <a class="category-card" href="/product_listing/index.html?category=tents">
            <img src="/images/noun_Tent_2517.svg" alt="" />
            <h2>Tents</h2>
          </a>
          <a class="category-card" href="/product_listing/index.html?category=backpacks">
            <img src="/images/noun_Backpack_65884.svg" alt="" />
            <h2>Backpacks</h2>
          </a>
          <a class="category-card" href="/product_listing/index.html?category=sleeping-bags">
            <h2>Sleeping Bags</h2>
          </a>
          <a class="category-card" href="/product_listing/index.html?category=hammocks">
            <h2>Hammocks</h2>
          </a>
        </div>
      </section>

      <button id="openNews">
        <p>Subscribe to our Newsletter!</p>
      </button>

      <dialog id="newsletter-dialouge">
        <form>
          <p>Get the latest news and updates from Sleep Outside.</p>

          <label for="name">Name: <input type="text" id="name" name="name" required /> </label>
          <label for="email">Email: <input type="email" id="email" name="email" required /></label>

          <div>
            <button type="submit" id="subscribeNews">Subscribe</button>
            <button type="button" id="closeNews">Nevermind</button>
          </div>

        </form>
      </dialog>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
